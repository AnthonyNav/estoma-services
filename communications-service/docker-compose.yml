# Local development only. estoma-infra owns real deployment manifests.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: communications_db
      POSTGRES_USER: communications_service
      POSTGRES_PASSWORD: communications_service
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U communications_service -d communications_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
