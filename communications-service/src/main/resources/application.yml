spring:
  application:
    name: communications-service

  datasource:
    url: ${COMM_DB_URL:jdbc:postgresql://localhost:5432/communications_db}
    username: ${COMM_DB_RUNTIME_USER:communications_service}
    password: ${COMM_DB_RUNTIME_PASSWORD:communications_service}
    hikari:
      connection-timeout: 10000
      validation-timeout: 5000
      data-source-properties:
        socketTimeout: 10
        connectTimeout: 10

  rabbitmq:
    host: ${COMM_RABBITMQ_HOST:localhost}
    port: ${COMM_RABBITMQ_PORT:5672}
    username: ${COMM_RABBITMQ_USERNAME:guest}
    password: ${COMM_RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      observation-enabled: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
    url: ${COMM_DB_URL:jdbc:postgresql://localhost:5432/communications_db}
    user: ${COMM_DB_MIGRATION_USER:communications_service}
    password: ${COMM_DB_MIGRATION_PASSWORD:communications_service}
    placeholders:
      runtime_role: ${COMM_DB_RUNTIME_USER:communications_service}

estoma:
  environment: ${ESTOMA_ENVIRONMENT:local}
  messaging:
    outbox-relay-delay: ${COMM_OUTBOX_RELAY_DELAY:500ms}
  communications:
    email:
      default-sender-name: ${COMM_EMAIL_DEFAULT_SENDER_NAME:Estoma}
      default-sender-address: ${COMM_EMAIL_DEFAULT_SENDER_ADDRESS:no-reply@estoma.edu}
      fake:
        mode: ${COMM_EMAIL_FAKE_MODE:accepted}
      worker:
        lease-duration-ms: "${COMM_EMAIL_WORKER_LEASE_MS:30000}"
        provider-timeout-ms: "${COMM_EMAIL_PROVIDER_TIMEOUT_MS:10000}"
        provider-timeout-safety-margin-ms: "${COMM_EMAIL_PROVIDER_TIMEOUT_SAFETY_MARGIN_MS:1000}"
        sweeper-interval-ms: "${COMM_EMAIL_WORKER_SWEEPER_INTERVAL_MS:5000}"
    admin:
      system-allowlist: ${COMM_ADMIN_SYSTEM_ALLOWLIST:}

server:
  port: 8080

logging:
  structured:
    format:
      console: com.estoma.communications.infrastructure.observability.EstomaJsonLogFormatter

management:
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://otel-collector.monitoring.svc.cluster.local:4318/v1/traces
  endpoints:
    access:
      default: none
    web:
      base-path: /
      exposure:
        include: health,info,prometheus
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      access: read-only
      probes:
        enabled: true
      show-details: never
      show-components: never
      group:
        startup:
          include: db, schemaVersion
        readiness:
          include: db, emailWorker, commandConsumer, outboxRelay
        liveness:
          include: livenessState
    info:
      access: read-only
    prometheus:
      access: read-only
  info:
    env:
      enabled: true

info:
  app:
    name: communications-service
    version: 0.1.0
