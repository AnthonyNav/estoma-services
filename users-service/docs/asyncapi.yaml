asyncapi: 3.0.0
info:
  title: Users Service V1 Messaging Contract
  version: 1.0.0
  description: >
    Canonical durable messaging contract for the users logical component.
    The deployable is users-service; its platform logicalComponentId is users.

defaultContentType: application/json

servers:
  rabbitmq:
    host: '{host}:{port}'
    protocol: amqp
    variables:
      host:
        default: localhost
      port:
        default: '5672'

channels:
  commands.users:
    address: commands.users
    messages:
      createPerson:
        $ref: '#/components/messages/CreatePerson'
      updatePerson:
        $ref: '#/components/messages/UpdatePerson'
      activatePerson:
        $ref: '#/components/messages/ActivatePerson'
      deactivatePerson:
        $ref: '#/components/messages/DeactivatePerson'
    bindings:
      amqp:
        is: queue
        queue:
          name: commands.users
          durable: true
          exclusive: false
          autoDelete: false

  queries.users:
    address: queries.users
    messages:
      resolvePerson:
        $ref: '#/components/messages/ResolvePersonByInstitutionalEmail'
      getPersonStatusSnapshot:
        $ref: '#/components/messages/GetPersonStatusSnapshot'
      listPersonStatusSnapshotsPage:
        $ref: '#/components/messages/ListPersonStatusSnapshotsPage'
      listPersonPresentationSnapshotsPage:
        $ref: '#/components/messages/ListPersonPresentationSnapshotsPage'
    bindings:
      amqp:
        is: queue
        queue:
          name: queries.users
          durable: true
          exclusive: false
          autoDelete: false

  platform.results:
    address: platform.results
    messages:
      createPersonResult:
        $ref: '#/components/messages/CreatePersonResult'
      updatePersonResult:
        $ref: '#/components/messages/UpdatePersonResult'
      resolvePersonResult:
        $ref: '#/components/messages/ResolvePersonByInstitutionalEmailResult'
      getPersonStatusSnapshotResult:
        $ref: '#/components/messages/GetPersonStatusSnapshotResult'
      listPersonStatusSnapshotsPageResult:
        $ref: '#/components/messages/ListPersonStatusSnapshotsPageResult'
      listPersonPresentationSnapshotsPageResult:
        $ref: '#/components/messages/ListPersonPresentationSnapshotsPageResult'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: platform.results
          type: direct
          durable: true

  platform.events:
    address: platform.events
    messages:
      personCreated:
        $ref: '#/components/messages/PersonCreated'
      personUpdated:
        $ref: '#/components/messages/PersonUpdated'
      personActivated:
        $ref: '#/components/messages/PersonActivated'
      personDeactivated:
        $ref: '#/components/messages/PersonDeactivated'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: platform.events
          type: topic
          durable: true

operations:
  receiveCommands:
    action: receive
    channel:
      $ref: '#/channels/commands.users'
  receiveQueries:
    action: receive
    channel:
      $ref: '#/channels/queries.users'
  sendResults:
    action: send
    channel:
      $ref: '#/channels/platform.results'
  sendEvents:
    action: send
    channel:
      $ref: '#/channels/platform.events'

components:
  messages:
    CreatePerson:
      name: CreatePerson
      payload:
        $ref: '#/components/schemas/CommandEnvelope'
    UpdatePerson:
      name: UpdatePerson
      payload:
        $ref: '#/components/schemas/CommandEnvelope'
    ActivatePerson:
      name: ActivatePerson
      payload:
        $ref: '#/components/schemas/CommandEnvelope'
    DeactivatePerson:
      name: DeactivatePerson
      payload:
        $ref: '#/components/schemas/CommandEnvelope'

    ResolvePersonByInstitutionalEmail:
      name: ResolvePersonByInstitutionalEmail
      payload:
        $ref: '#/components/schemas/QueryEnvelope'
    GetPersonStatusSnapshot:
      name: GetPersonStatusSnapshot
      payload:
        $ref: '#/components/schemas/QueryEnvelope'
    ListPersonStatusSnapshotsPage:
      name: ListPersonStatusSnapshotsPage
      payload:
        $ref: '#/components/schemas/QueryEnvelope'
    ListPersonPresentationSnapshotsPage:
      name: ListPersonPresentationSnapshotsPage
      payload:
        $ref: '#/components/schemas/ListPersonPresentationSnapshotsPageQueryEnvelope'

    CreatePersonResult:
      name: CreatePersonResult
      payload:
        $ref: '#/components/schemas/ResultEnvelope'
    UpdatePersonResult:
      name: UpdatePersonResult
      payload:
        $ref: '#/components/schemas/ResultEnvelope'
    ResolvePersonByInstitutionalEmailResult:
      name: ResolvePersonByInstitutionalEmailResult
      payload:
        $ref: '#/components/schemas/ResultEnvelope'
    GetPersonStatusSnapshotResult:
      name: GetPersonStatusSnapshotResult
      payload:
        $ref: '#/components/schemas/ResultEnvelope'
    ListPersonStatusSnapshotsPageResult:
      name: ListPersonStatusSnapshotsPageResult
      payload:
        $ref: '#/components/schemas/ResultEnvelope'
    ListPersonPresentationSnapshotsPageResult:
      name: ListPersonPresentationSnapshotsPageResult
      payload:
        $ref: '#/components/schemas/ListPersonPresentationSnapshotsPageResultEnvelope'

    PersonCreated:
      name: PersonCreated
      payload:
        $ref: '#/components/schemas/EventEnvelope'
      bindings:
        amqp:
          routingKey: users.person.created
    PersonUpdated:
      name: PersonUpdated
      payload:
        $ref: '#/components/schemas/EventEnvelope'
      bindings:
        amqp:
          routingKey: users.person.updated
    PersonActivated:
      name: PersonActivated
      payload:
        $ref: '#/components/schemas/EventEnvelope'
      bindings:
        amqp:
          routingKey: users.person.activated
    PersonDeactivated:
      name: PersonDeactivated
      payload:
        $ref: '#/components/schemas/EventEnvelope'
      bindings:
        amqp:
          routingKey: users.person.deactivated

  schemas:
    Uuid:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time

    AccountActor:
      type: object
      additionalProperties: false
      required: [type, accountId]
      properties:
        type:
          const: ACCOUNT
        accountId:
          $ref: '#/components/schemas/Uuid'

    SystemActor:
      type: object
      additionalProperties: false
      required: [type, service]
      properties:
        type:
          const: SYSTEM
        service:
          type: string
          minLength: 1

    Actor:
      oneOf:
        - $ref: '#/components/schemas/AccountActor'
        - $ref: '#/components/schemas/SystemActor'

    BaseEnvelope:
      type: object
      required:
        - messageId
        - messageType
        - messageVersion
        - messageKind
        - producer
        - occurredAt
        - correlationId
        - actor
        - payload
      properties:
        messageId:
          $ref: '#/components/schemas/Uuid'
        messageType:
          type: string
          minLength: 1
        messageVersion:
          const: 1
        messageKind:
          type: string
        producer:
          type: string
          minLength: 1
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        correlationId:
          $ref: '#/components/schemas/Uuid'
        causationId:
          $ref: '#/components/schemas/Uuid'
        operationId:
          $ref: '#/components/schemas/Uuid'
        idempotencyKey:
          type: string
          minLength: 1
        aggregateId:
          $ref: '#/components/schemas/Uuid'
        aggregateVersion:
          type: integer
          minimum: 1
        actor:
          $ref: '#/components/schemas/Actor'
        payload:
          type: object

    CommandEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseEnvelope'
        - type: object
          required: [operationId, idempotencyKey, aggregateId]
          properties:
            messageKind:
              const: COMMAND

    QueryEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseEnvelope'
        - type: object
          required: [operationId]
          properties:
            messageKind:
              const: QUERY

    ListPersonPresentationSnapshotsPageQueryEnvelope:
      allOf:
        - $ref: '#/components/schemas/QueryEnvelope'
        - type: object
          properties:
            messageType:
              const: ListPersonPresentationSnapshotsPage
            producer:
              const: bff
            payload:
              type: object
              additionalProperties: false
              required: [limit]
              properties:
                limit:
                  const: 200
                cursor:
                  $ref: '#/components/schemas/Uuid'

    ResultEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseEnvelope'
        - type: object
          required: [causationId, operationId]
          properties:
            messageKind:
              const: RESULT
            producer:
              const: users

    ListPersonPresentationSnapshotsPageResultEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResultEnvelope'
        - type: object
          properties:
            messageType:
              const: ListPersonPresentationSnapshotsPageResult
            payload:
              $ref: '#/components/schemas/PersonPresentationSnapshotsPageResultPayload'

    EventEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseEnvelope'
        - type: object
          required: [causationId, aggregateId, aggregateVersion]
          properties:
            messageKind:
              const: EVENT
            producer:
              const: users

    ImportExecution:
      type: object
      additionalProperties: true
      required: [importId, planItemId, executionGeneration, authorizedByAccountId, scope]
      properties:
        importId:
          $ref: '#/components/schemas/Uuid'
        planItemId:
          $ref: '#/components/schemas/Uuid'
        executionGeneration:
          type: integer
          minimum: 1
        authorizedByAccountId:
          $ref: '#/components/schemas/Uuid'
        scope:
          enum: [CREATE_PERSON, UPDATE_PERSON]

    PersonStatusSnapshot:
      type: object
      additionalProperties: false
      required: [personId, status, sourceVersion, updatedAt]
      properties:
        personId:
          $ref: '#/components/schemas/Uuid'
        status:
          enum: [ACTIVE, INACTIVE]
        sourceVersion:
          type: integer
          minimum: 1
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    PersonPresentationSnapshot:
      type: object
      additionalProperties: false
      required: [personId, firstName, paternalSurname, institutionalEmail, status, sourceVersion, updatedAt]
      properties:
        personId:
          $ref: '#/components/schemas/Uuid'
        firstName:
          type: string
          minLength: 1
        paternalSurname:
          type: string
          minLength: 1
        maternalSurname:
          type: string
          minLength: 1
        institutionalEmail:
          type: string
          format: email
        status:
          enum: [ACTIVE, INACTIVE]
        sourceVersion:
          type: integer
          minimum: 1
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    PersonPresentationSnapshotsPage:
      type: object
      additionalProperties: false
      required: [items, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PersonPresentationSnapshot'
        hasMore:
          type: boolean
        nextCursor:
          $ref: '#/components/schemas/Uuid'

    ResultError:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          minLength: 1

    PersonPresentationSnapshotsPageResultPayload:
      oneOf:
        - type: object
          additionalProperties: false
          required: [status, data]
          properties:
            status:
              const: SUCCEEDED
            data:
              $ref: '#/components/schemas/PersonPresentationSnapshotsPage'
        - type: object
          additionalProperties: false
          required: [status, error]
          properties:
            status:
              const: FAILED
            error:
              $ref: '#/components/schemas/ResultError'

    AcademicResultData:
      type: object
      additionalProperties: false
      required: [importId, planItemId, executionGeneration]
      properties:
        importId:
          $ref: '#/components/schemas/Uuid'
        planItemId:
          $ref: '#/components/schemas/Uuid'
        executionGeneration:
          type: integer
          minimum: 1
