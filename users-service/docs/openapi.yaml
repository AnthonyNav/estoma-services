openapi: 3.1.0

info:
  title: users-service operational surface
  version: 1.0.0
  description: >
    users-service exposes NO business REST API. All business operations
    (create/update/activate/deactivate a Person) arrive exclusively as
    durable commands over RabbitMQ — see docs/asyncapi.yaml. This document
    covers only the operational HTTP surface used by Kubernetes probes and
    Prometheus scraping. There is no `/api` prefix and no client-facing
    resource here; the BFF is the platform's only public HTTP surface
    (estomatologia-platform-docs 02-architecture/README.md).

    Every path below is unauthenticated by design (probes and scrapers run
    inside the cluster network) and returns no information about Person
    data. Full endpoint lock-down (deny-by-default Actuator exposure,
    denyAll() on everything else) is described in system-contract.md §12.

servers:
  - url: http://users-service.platform-{env}.svc.cluster.local:8080
    variables:
      env:
        default: dev
        enum: [dev, staging, prod]

paths:
  /health:
    get:
      summary: Aggregate health (all registered indicators)
      operationId: getHealth
      responses:
        '200':
          description: Aggregate status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: One or more indicators are DOWN.

  /health/startup:
    get:
      summary: Startup probe
      description: >
        UP once the schema is at the expected Flyway version and the
        application context has finished initializing. Used as the
        Kubernetes startupProbe so slow migrations do not trip
        liveness/readiness prematurely.
      operationId: getStartupHealth
      responses:
        '200':
          description: Ready to begin serving readiness/liveness checks.
        '503':
          description: Still starting up.

  /health/readiness:
    get:
      summary: Readiness probe
      description: >
        UP only when PostgreSQL is reachable, Flyway migrations are at the
        expected version, and the command consumer and outbox relay are
        running. A pod that is not Ready is removed from Service load
        balancing but is not restarted.
      operationId: getReadinessHealth
      responses:
        '200':
          description: Can accept and process commands.
        '503':
          description: Cannot currently fulfil its function; remove from traffic.

  /health/liveness:
    get:
      summary: Liveness probe
      description: >
        Cheap process-health check only. Deliberately excludes database and
        broker connectivity — a temporarily degraded dependency must not
        cause a restart loop (see system-contract.md §11).
      operationId: getLivenessHealth
      responses:
        '200':
          description: Process is alive.
        '503':
          description: Process should be restarted.

  /metrics:
    get:
      summary: Prometheus scrape endpoint
      description: >
        Actuator's `prometheus` endpoint, remapped to `/metrics` via
        `management.endpoints.web.path-mapping`. Includes the mandatory
        Outbox and consumer metrics described in system-contract.md §11.
      operationId: getMetrics
      responses:
        '200':
          description: Metrics in Prometheus text exposition format.
          content:
            text/plain: {}

  /info:
    get:
      summary: Build information
      description: >
        Populated by the spring-boot-maven-plugin build-info goal. Replaces
        the earlier hand-written `GET /version` endpoint.
      operationId: getInfo
      responses:
        '200':
          description: Build metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  build:
                    type: object
                    properties:
                      name: { type: string }
                      version: { type: string }

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN]
