spring:
  application:
    name: users-service

  datasource:
    url: ${USERS_DB_URL:jdbc:postgresql://localhost:5432/users_db}
    username: ${USERS_DB_RUNTIME_USER:users_service}
    password: ${USERS_DB_RUNTIME_PASSWORD:users_service}

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
    # Separate migration credentials, per
    # security-observability.md:235. Defaults to the runtime credentials
    # so a single-user local/dev database still works; estoma-infra
    # supplies distinct migration credentials in staging/prod.
    url: ${USERS_DB_URL:jdbc:postgresql://localhost:5432/users_db}
    user: ${USERS_DB_MIGRATION_USER:users_service}
    password: ${USERS_DB_MIGRATION_PASSWORD:users_service}
    placeholders:
      runtime_role: ${USERS_DB_RUNTIME_USER:users_service}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    # Required for RabbitConfig's RabbitTemplate confirm/return callbacks
    # to actually fire (docs/system-contract.md §7: publisher confirms on
    # every publish).
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # Broker-side TTL retry tiers handle backoff, not Spring AMQP's
        # in-process retry (docs/system-contract.md §9) -- it would block
        # the consumer thread for the whole backoff and lose the attempt
        # count on pod restart.
        retry:
          enabled: false
        default-requeue-rejected: false

estoma:
  messaging:
    allowed-producers: bff
    topology-declare: ${ESTOMA_MESSAGING_TOPOLOGY_DECLARE:true}
    command-max-attempts: 3
  outbox:
    claim-batch-size: 20
    lease: 30s
    max-attempts: 10
    published-retention: 7d
    inbox-retention: 30d

server:
  port: 8080

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  info:
    env:
      enabled: true

info:
  app:
    name: users-service
    version: 0.1.0
