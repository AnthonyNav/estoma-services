spring:
  application:
    name: users-service

  datasource:
    url: ${USERS_DB_URL:jdbc:postgresql://localhost:5432/users_db}
    username: ${USERS_DB_RUNTIME_USER:users_service}
    password: ${USERS_DB_RUNTIME_PASSWORD:users_service}
    hikari:
      connection-timeout: 10000
      validation-timeout: 5000
      data-source-properties:
        socketTimeout: 10
        connectTimeout: 10

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
    url: ${USERS_DB_URL:jdbc:postgresql://localhost:5432/users_db}
    user: ${USERS_DB_MIGRATION_USER:users_service}
    password: ${USERS_DB_MIGRATION_PASSWORD:users_service}
    placeholders:
      runtime_role: ${USERS_DB_RUNTIME_USER:users_service}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        retry:
          enabled: false
        default-requeue-rejected: false
        observation-enabled: true
    template:
      observation-enabled: true

estoma:
  environment: ${ESTOMA_ENVIRONMENT:local}
  messaging:
    command-producers:
      bff:
        - CreatePerson
        - UpdatePerson
        - ActivatePerson
        - DeactivatePerson
      academic:
        - CreatePerson
        - UpdatePerson
    query-producers:
      academic:
        - ResolvePersonByInstitutionalEmail
      authorization:
        - GetPersonStatusSnapshot
        - ListPersonStatusSnapshotsPage
    topology-declare: ${ESTOMA_MESSAGING_TOPOLOGY_DECLARE:true}
    command-max-attempts: 3
    query-max-attempts: 3
    publisher-confirm-timeout: 5s
  outbox:
    claim-batch-size: 10
    lease: 2m
    max-attempts: 10
    published-retention: 7d
    inbox-retention: 30d
    retry-delays: [5s, 30s, 2m, 5m, 10m, 15m]

server:
  port: 8080

logging:
  structured:
    format:
      console: com.estoma.users.observability.EstomaJsonLogFormatter

management:
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://otel-collector.monitoring.svc.cluster.local:4318/v1/traces
  endpoints:
    access:
      default: none
    web:
      base-path: /
      exposure:
        include: health,info,prometheus
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      access: read-only
      probes:
        enabled: true
      show-details: never
      show-components: never
      group:
        startup:
          include: db, schemaVersion
        readiness:
          include: db, commandConsumer, queryConsumer, outboxRelay
        liveness:
          include: livenessState
    info:
      access: read-only
    prometheus:
      access: read-only
  info:
    env:
      enabled: true

info:
  app:
    name: users-service
    version: 0.1.0
