# Local development only. estoma-infra owns real deployment manifests
# (see root README.md) -- this file exists so `./mvnw spring-boot:run`
# has something to talk to using nothing but the defaults already baked
# into src/main/resources/application.yml (no env vars required).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: users_service
      POSTGRES_PASSWORD: users_service
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users_service -d users_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # management UI: http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
