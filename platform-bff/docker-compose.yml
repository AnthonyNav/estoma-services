# Local development only. estoma-infra owns real deployment manifests
# (see root README.md) -- this file exists so `./mvnw spring-boot:run`
# has something to talk to using nothing but the defaults already baked
# into src/main/resources/application.yml, except BFF_DB_URL below.
#
# Postgres only: RabbitMQ is shared platform infrastructure -- bring up
# jornadas-service/docker-compose.yml (or any other service's) first, it
# declares the shared broker on the default port 5672.
#
# Postgres is published on host port 5435, not 5432: on at least one dev
# machine in this project 127.0.0.1:5432 is already owned by a pre-existing
# Homebrew postgresql@14 service, and jornadas-service/registros-service
# already claimed 5433/5434.
# Run with BFF_DB_URL=jdbc:postgresql://localhost:5435/bff-db.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bff-db
      POSTGRES_USER: bff
      POSTGRES_PASSWORD: bff
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bff -d bff-db"]
      interval: 5s
      timeout: 5s
      retries: 10
