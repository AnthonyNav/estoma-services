spring:
  application:
    name: platform-bff
  datasource:
    url: ${BFF_DB_URL:jdbc:postgresql://localhost:5432/bff-db}
    username: ${BFF_DB_USERNAME:bff}
    password: ${BFF_DB_PASSWORD:bff}
    hikari:
      maximum-pool-size: ${BFF_DB_POOL_SIZE:4}
      minimum-idle: ${BFF_DB_MIN_IDLE:1}
      connection-timeout: 10000
      validation-timeout: 5000
  flyway:
    enabled: ${BFF_FLYWAY_ENABLED:true}
    baseline-on-migrate: false
  rabbitmq:
    addresses: ${BFF_RABBITMQ_ADDRESSES:amqp://localhost:5672}
    username: ${BFF_RABBITMQ_USERNAME:guest}
    password: ${BFF_RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        auto-startup: ${BFF_RABBITMQ_LISTENERS_ENABLED:true}
        observation-enabled: true
    template:
      observation-enabled: true
server:
  port: 8080
management:
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://otel-collector.monitoring.svc.cluster.local:4318/v1/traces
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  info:
    env:
      enabled: true
info:
  app:
    name: platform-bff
    version: 0.1.0
platform:
  component-id: ${BFF_LOGICAL_COMPONENT_ID:bff}
  messaging:
    topology-declare: ${BFF_RABBITMQ_TOPOLOGY_DECLARE:true}
    listeners-enabled: ${BFF_RABBITMQ_LISTENERS_ENABLED:true}
  outbox:
    enabled: ${BFF_OUTBOX_ENABLED:true}
    poll-interval: ${BFF_OUTBOX_POLL_INTERVAL:250ms}
    batch-size: ${BFF_OUTBOX_BATCH_SIZE:50}
    confirm-timeout: ${BFF_OUTBOX_CONFIRM_TIMEOUT:8s}
    max-attempts: ${BFF_OUTBOX_MAX_ATTEMPTS:10}
  security-rpc:
    request-ttl: ${BFF_SECURITY_RPC_TTL:10s}
    timeout: ${BFF_SECURITY_RPC_TIMEOUT:8s}
    retry-attempts: 0
  jwt:
    issuer: ${BFF_JWT_ISSUER:estoma-authentication}
    audience: ${BFF_JWT_AUDIENCE:estoma-clients}
    jwk-set: ${BFF_JWK_SET:}
  retention:
    operation-days: ${BFF_OPERATION_RETENTION_DAYS:7}
    idempotency-hours: ${BFF_IDEMPOTENCY_RETENTION_HOURS:24}
    outbox-published-days: ${BFF_OUTBOX_PUBLISHED_RETENTION_DAYS:7}
    outbox-failed-days: ${BFF_OUTBOX_FAILED_RETENTION_DAYS:30}
    inbox-days: ${BFF_INBOX_RETENTION_DAYS:30}
    recovery-job-days: ${BFF_RECOVERY_JOB_RETENTION_DAYS:30}
  genesis:
    enabled: ${BFF_GENESIS_ENABLED:false}
    environment-fresh: ${BFF_GENESIS_ENVIRONMENT_FRESH:false}
  recovery:
    enabled: ${BFF_RECOVERY_ENABLED:true}
    system-catalog-refresh-codes: ${BFF_SYSTEM_CATALOG_REFRESH_CODES:}
    appointment-qr:
      # Enable only after every BFF replica runs the QR recovery writer and Appointments QR is enabled.
      enabled: ${BFF_APPOINTMENT_QR_RECOVERY_ENABLED:false}
      restart-revision: ${BFF_APPOINTMENT_QR_RECOVERY_RESTART_REVISION:0}
      page-size: ${BFF_APPOINTMENT_QR_RECOVERY_PAGE_SIZE:100}
      max-pages-per-pass: ${BFF_APPOINTMENT_QR_RECOVERY_MAX_PAGES_PER_PASS:10000}
      result-timeout: ${BFF_APPOINTMENT_QR_RECOVERY_RESULT_TIMEOUT:2m}
      sweep-interval: ${BFF_APPOINTMENT_QR_RECOVERY_SWEEP_INTERVAL:30s}
  appointments:
    availability:
      snapshot-ttl: ${BFF_APPOINTMENT_AVAILABILITY_SNAPSHOT_TTL:30s}
      refresh-retry-after: ${BFF_APPOINTMENT_AVAILABILITY_REFRESH_RETRY_AFTER:30s}
      client-retry-after-seconds: ${BFF_APPOINTMENT_AVAILABILITY_CLIENT_RETRY_AFTER_SECONDS:1}
  wash:
    # HTTP producer gate; enable only after owner support and all V2 readers are deployed.
    unclassified-entry-rejection-enabled: ${BFF_WASH_UNCLASSIFIED_ENTRY_REJECTION_ENABLED:false}
    # Advertise direct supervisor completion only after the owner capability is enabled everywhere.
    direct-supervisor-completion-enabled: ${BFF_WASH_DIRECT_SUPERVISOR_COMPLETION_ENABLED:false}
    qr:
      # Public Home/lookup gate; enable only after the date-scoped recovery and data audit.
      enabled: ${BFF_WASH_QR_ENABLED:false}
    reassignment-candidates:
      # Rollout gate: enable only after the Wash Execution owner Query is deployed.
      enabled: ${BFF_WASH_REASSIGNMENT_CANDIDATES_ENABLED:false}
      snapshot-ttl: 10s
      refresh-interval: ${BFF_WASH_REASSIGNMENT_CANDIDATES_REFRESH_INTERVAL:5s}
      sweep-interval: ${BFF_WASH_REASSIGNMENT_CANDIDATES_SWEEP_INTERVAL:1s}
      refresh-retention: ${BFF_WASH_REASSIGNMENT_CANDIDATES_REFRESH_RETENTION:1h}
      batch-size: ${BFF_WASH_REASSIGNMENT_CANDIDATES_BATCH_SIZE:25}
