spring:
  application:
    name: infra-test

server:
  port: 8080

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  info:
    env:
      enabled: true

info:
  app:
    name: infra-test
    version: 0.2.0
