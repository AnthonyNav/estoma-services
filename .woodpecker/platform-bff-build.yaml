when:
  - event: manual
    branch: develop
  - event: push
    branch: develop
    path:
      include:
        - platform-bff/**
        - .woodpecker/platform-bff-build.yaml
        - .woodpecker/platform-bff-gitops.yaml
        - scripts/woodpecker/**

steps:
  - name: build-and-push
    image: woodpeckerci/plugin-kaniko:2.3.2
    settings:
      registry: ghcr.io
      repo: anthonynav/platform-bff
      context: platform-bff
      dockerfile: platform-bff/Dockerfile
      username:
        from_secret: GHCR_USERNAME
      password:
        from_secret: GHCR_TOKEN
      tags:
        - develop-${CI_COMMIT_SHA:0:7}
        - develop
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 750m
            memory: 1Gi
