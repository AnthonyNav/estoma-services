labels:
  testcontainers: "true"

when:
  - event: manual
    branch: develop
  - event: pull_request
    path:
      include:
        - platform-bff/**
        - .woodpecker/platform-bff-test.yaml
        - .woodpecker/platform-bff-build.yaml
        - .woodpecker/platform-bff-gitops.yaml
        - scripts/woodpecker/**
  - event: push
    branch: develop
    path:
      include:
        - platform-bff/**
        - .woodpecker/platform-bff-test.yaml
        - .woodpecker/platform-bff-build.yaml
        - .woodpecker/platform-bff-gitops.yaml
        - scripts/woodpecker/**

steps:
  - name: validate-client-artifacts
    image: node:22-alpine
    directory: platform-bff
    commands:
      - node e2e/scripts/validate-openapi-postman.mjs
      - node e2e/scripts/validate-auth-workflow.mjs
      - node e2e/scripts/validate-wash-student-workflow.mjs
      - sh -n e2e/fixtures/wash-student/fixture-db.sh
      - sh -n e2e/fixtures/wash-student/psql-exec.example.sh
      - sh -n e2e/runner/run-wash-student.sh
      - sh -n e2e/runner/run.sh

  - name: test
    image: maven:3.9.16-eclipse-temurin-25
    directory: platform-bff
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - mvn -s "$CI_WORKSPACE/.woodpecker/maven-settings.xml" -B clean verify
