labels:
  testcontainers: "true"

when:
  - event: manual
    branch: develop
  - event: pull_request
    path:
      include:
        - platform-bff/**
        - .woodpecker/platform-bff-test.yaml
        - .woodpecker/platform-bff-build.yaml
        - .woodpecker/platform-bff-gitops.yaml
        - scripts/woodpecker/**
  - event: push
    branch: develop
    path:
      include:
        - platform-bff/**
        - .woodpecker/platform-bff-test.yaml
        - .woodpecker/platform-bff-build.yaml
        - .woodpecker/platform-bff-gitops.yaml
        - scripts/woodpecker/**

steps:
  - name: validate-client-artifacts
    image: node:22-alpine
    directory: platform-bff
    commands:
      - sh e2e/scripts/validate-client-artifacts.sh

  - name: terminal-cleanup-postgres
    image: docker:cli@sha256:eccaacfeed644c7de222ff047483568cb988dde95476fbaaf10ea2d04921bb66
    directory: platform-bff
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - sh e2e/scripts/test-wash-exit-completion-postgres.sh

  - name: test
    image: maven:3.9.16-eclipse-temurin-25
    directory: platform-bff
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - mvn -s "$CI_WORKSPACE/.woodpecker/maven-settings.xml" -B clean verify
