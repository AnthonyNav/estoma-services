labels:
  testcontainers: "true"

when:
  - event: manual
    branch: develop
  - event: pull_request
    path:
      include:
        - platform-bff/**
        - .woodpecker/platform-bff-test.yaml
        - .woodpecker/platform-bff-build.yaml
        - .woodpecker/platform-bff-gitops.yaml
        - scripts/woodpecker/**
  - event: push
    branch: develop
    path:
      include:
        - platform-bff/**
        - .woodpecker/platform-bff-test.yaml
        - .woodpecker/platform-bff-build.yaml
        - .woodpecker/platform-bff-gitops.yaml
        - scripts/woodpecker/**

steps:
  - name: test
    image: maven:3.9.16-eclipse-temurin-25
    directory: platform-bff
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - mvn -s "$CI_WORKSPACE/.woodpecker/maven-settings.xml" -B clean verify
