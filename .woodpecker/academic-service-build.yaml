when:
  # Touching this workflow rebuilds the immutable develop image after GitOps changes.
  # Recovery-envelope contract changes must be promoted through this immutable image.
  - event: manual
    branch: develop
  - event: push
    branch: develop
    path:
      include:
        - academic-service/**
        - .woodpecker/academic-service-test.yaml
        - .woodpecker/academic-service-build.yaml
        - .woodpecker/academic-service-gitops.yaml
        - scripts/woodpecker/**

depends_on:
  - academic-service-test

steps:
  - name: build-and-push
    image: woodpeckerci/plugin-kaniko:2.3.2
    settings:
      registry: ghcr.io
      repo: anthonynav/academic-service
      context: academic-service
      dockerfile: academic-service/Dockerfile
      username:
        from_secret: GHCR_USERNAME
      password:
        from_secret: GHCR_TOKEN
      tags:
        - develop-${CI_COMMIT_SHA:0:7}
        - develop
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 750m
            memory: 1Gi
