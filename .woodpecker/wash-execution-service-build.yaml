when:
  # Retry the immutable develop image after the initial promotion pass.
  - event: manual
    branch: develop
  - event: push
    branch: develop
    path:
      include:
        - wash-execution-service/**
        - .woodpecker/wash-execution-service-test.yaml
        - .woodpecker/wash-execution-service-build.yaml
        - .woodpecker/wash-execution-service-gitops.yaml
        - scripts/woodpecker/**

depends_on:
  - wash-execution-service-test

steps:
  - name: build-and-push
    image: woodpeckerci/plugin-kaniko:2.3.2
    settings:
      registry: ghcr.io
      repo: anthonynav/wash-execution-service
      context: wash-execution-service
      dockerfile: wash-execution-service/Dockerfile
      username:
        from_secret: GHCR_USERNAME
      password:
        from_secret: GHCR_TOKEN
      tags:
        - develop-${CI_COMMIT_SHA:0:7}
        - develop
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 750m
            memory: 1Gi
