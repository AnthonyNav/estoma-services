when:
  - event: manual
    branch: develop
  - event: push
    branch: develop
    path:
      include:
        - registros-service/**
        - .woodpecker/registros-service-test.yaml
        - .woodpecker/registros-service-build.yaml
        - .woodpecker/registros-service-gitops.yaml
        - scripts/woodpecker/**

depends_on:
  - registros-service-test

steps:
  - name: build-and-push
    image: woodpeckerci/plugin-kaniko:2.3.2
    settings:
      registry: ghcr.io
      repo: anthonynav/registros-service
      context: registros-service
      dockerfile: registros-service/Dockerfile
      username:
        from_secret: GHCR_USERNAME
      password:
        from_secret: GHCR_TOKEN
      tags:
        - develop-${CI_COMMIT_SHA:0:7}
        - develop
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 750m
            memory: 1Gi
