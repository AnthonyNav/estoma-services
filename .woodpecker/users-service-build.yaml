when:
  - event: push
    branch: [develop, main]
    path:
      include:
        - users-service/**
        - .woodpecker/users-service-test.yaml
        - .woodpecker/users-service-build.yaml
        - .woodpecker/users-service-gitops.yaml
        - scripts/woodpecker/**

depends_on:
  - users-service-test

steps:
  - name: build-and-push
    image: woodpeckerci/plugin-kaniko:2.3.2
    settings:
      registry: ghcr.io
      repo: anthonynav/users-service
      context: users-service
      dockerfile: users-service/Dockerfile
      username:
        from_secret: GHCR_USERNAME
      password:
        from_secret: GHCR_TOKEN
      tags:
        - ${CI_COMMIT_BRANCH}-${CI_COMMIT_SHA:0:7}
        - ${CI_COMMIT_BRANCH}
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 750m
            memory: 1Gi
