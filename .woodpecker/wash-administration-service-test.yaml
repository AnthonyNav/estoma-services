labels:
  testcontainers: victus

when:
  - event: manual
    branch: develop
  - event: pull_request
    path:
      include:
        - wash-administration-service/**
        - .woodpecker/wash-administration-service-test.yaml
        - .woodpecker/wash-administration-service-build.yaml
        - .woodpecker/wash-administration-service-gitops.yaml
        - scripts/woodpecker/**
  - event: push
    branch: develop
    path:
      include:
        - wash-administration-service/**
        - .woodpecker/wash-administration-service-test.yaml
        - .woodpecker/wash-administration-service-build.yaml
        - .woodpecker/wash-administration-service-gitops.yaml
        - scripts/woodpecker/**

steps:
  - name: test
    image: maven:3.9.16-eclipse-temurin-25
    directory: wash-administration-service
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - ./mvnw -B clean verify
