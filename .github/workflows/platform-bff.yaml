name: platform-bff

on:
  pull_request:
    paths:
      - "platform-bff/**"
      - ".github/workflows/platform-bff.yaml"
  push:
    branches:
      - develop
      - main
    paths:
      - "platform-bff/**"
      - ".github/workflows/platform-bff.yaml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-bff
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: platform-bff/pom.xml

      - name: Run tests
        run: ./mvnw -B clean verify
