name: infra-test

on:
  pull_request:
    paths:
      - "infra-test/**"
      - ".github/workflows/infra-test.yaml"
      - ".github/workflows/service-ci.yaml"
  push:
    branches:
      - develop
      - main
    paths:
      - "infra-test/**"
      - ".github/workflows/infra-test.yaml"
      - ".github/workflows/service-ci.yaml"

permissions:
  contents: read
  packages: write

jobs:
  service-ci:
    uses: ./.github/workflows/service-ci.yaml
    with:
      service-name: infra-test
      image-name: ghcr.io/anthonynav/infra-test
      infra-overlay-path: apps/infra-test/overlays/develop/kustomization.yaml
    secrets: inherit
