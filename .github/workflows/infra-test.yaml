name: infra-test

on:
  pull_request:
    paths:
      - "infra-test/**"
      - ".github/workflows/infra-test.yaml"
  push:
    branches:
      - develop
      - main
    paths:
      - "infra-test/**"
      - ".github/workflows/infra-test.yaml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/anthonynav/infra-test

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra-test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: infra-test/pyproject.toml

      - name: Install dependencies
        run: pip install -e '.[test]'

      - name: Run tests
        run: pytest

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set image tag
        id: meta
        run: |
          short_sha="${GITHUB_SHA::7}"
          branch="${GITHUB_REF_NAME//\//-}"
          echo "tag=${branch}-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./infra-test
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=infra-test
