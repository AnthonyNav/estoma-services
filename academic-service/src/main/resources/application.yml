spring:
  application:
    name: academic-service
server:
  port: 8080
management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  info:
    env:
      enabled: true
info:
  app:
    name: academic-service
    version: 0.1.0
