spring:
  application:
    name: academic-service
  datasource:
    url: ${ACADEMIC_DB_URL:jdbc:postgresql://localhost:5432/academic_db}
    username: ${ACADEMIC_DB_RUNTIME_USER:academic_service}
    password: ${ACADEMIC_DB_RUNTIME_PASSWORD:academic_service}
    hikari:
      maximum-pool-size: ${ACADEMIC_DB_POOL_SIZE:4}
      minimum-idle: ${ACADEMIC_DB_MIN_IDLE:1}
      connection-timeout: 10000
      validation-timeout: 5000
  flyway:
    url: ${ACADEMIC_DB_URL:jdbc:postgresql://localhost:5432/academic_db}
    user: ${ACADEMIC_DB_MIGRATION_USER:academic_service}
    password: ${ACADEMIC_DB_MIGRATION_PASSWORD:academic_service}
    placeholders:
      runtime_role: ${ACADEMIC_DB_RUNTIME_USER:academic_service}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        default-requeue-rejected: false
        observation-enabled: true
        retry:
          enabled: false
    template:
      observation-enabled: true
estoma:
  messaging:
    topology-declare: ${ESTOMA_MESSAGING_TOPOLOGY_DECLARE:true}
    listeners-enabled: ${ESTOMA_MESSAGING_LISTENERS_ENABLED:true}
    retry-max-attempts: ${ESTOMA_MESSAGING_RETRY_MAX_ATTEMPTS:3}
  outbox:
    claim-batch-size: 20
    lease: 3m
    max-attempts: 10
    retry-delay: 5s
    confirm-timeout: 5s
    publish-backoff: 100ms
  authorization-recovery:
    result-timeout: ${ESTOMA_AUTHORIZATION_RECOVERY_RESULT_TIMEOUT:30m}
    failed-retry-delay: ${ESTOMA_AUTHORIZATION_RECOVERY_FAILED_RETRY_DELAY:15m}
    max-attempts: ${ESTOMA_AUTHORIZATION_RECOVERY_MAX_ATTEMPTS:3}
server:
  port: 8080
management:
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://otel-collector.monitoring.svc.cluster.local:4318/v1/traces
  endpoints:
    access:
      default: none
    web:
      base-path: /
      exposure:
        include: health,info,prometheus
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      access: read-only
      probes:
        enabled: true
      show-details: never
      group:
        startup:
          include: db, schemaVersion
        readiness:
          include: db, commandConsumer, queryConsumer, resultConsumer, eventProjectionConsumer, outboxRelay, authorizationProjectionRecovery
        liveness:
          include: livenessState
    info:
      access: read-only
    prometheus:
      access: read-only
  info:
    env:
      enabled: true
info:
  app:
    name: academic-service
    version: 0.1.0
