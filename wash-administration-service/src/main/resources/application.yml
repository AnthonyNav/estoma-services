spring:
  application:
    name: wash-administration-service

  datasource:
    url: ${WASH_ADMINISTRATION_DB_URL:jdbc:postgresql://localhost:5432/wash_administration_db}
    username: ${WASH_ADMINISTRATION_DB_RUNTIME_USER:wash_administration_service}
    password: ${WASH_ADMINISTRATION_DB_RUNTIME_PASSWORD:wash_administration_service}
    hikari:
      connection-timeout: 10000
      validation-timeout: 5000
      data-source-properties:
        socketTimeout: 10
        connectTimeout: 10

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
    url: ${WASH_ADMINISTRATION_DB_URL:jdbc:postgresql://localhost:5432/wash_administration_db}
    user: ${WASH_ADMINISTRATION_DB_MIGRATION_USER:wash_administration_service}
    password: ${WASH_ADMINISTRATION_DB_MIGRATION_PASSWORD:wash_administration_service}
    placeholders:
      runtime_role: ${WASH_ADMINISTRATION_DB_RUNTIME_USER:wash_administration_service}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        retry:
          enabled: false
        default-requeue-rejected: false

server:
  port: 8080

logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    access:
      default: none
    web:
      base-path: /
      exposure:
        include: health,info,prometheus
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      access: read-only
      probes:
        enabled: true
      show-details: never
      show-components: never
      group:
        startup:
          include: db, schemaVersion
        readiness:
          include: db, schemaVersion, rabbit, commandConsumer, queryConsumer, authorizationEventConsumer, authorizationRecoveryResultConsumer, outboxRelay, authorizationRecovery
        liveness:
          include: livenessState
    info:
      access: read-only
    prometheus:
      access: read-only
  info:
    env:
      enabled: true

info:
  app:
    name: wash-administration-service
    version: 0.1.0

estoma:
  environment: ${ESTOMA_ENVIRONMENT:local}
  messaging:
    topology-declare: ${ESTOMA_MESSAGING_TOPOLOGY_DECLARE:true}
    publisher-confirm-timeout: ${ESTOMA_PUBLISHER_CONFIRM_TIMEOUT:5s}
    outbox-claim-batch-size: ${ESTOMA_OUTBOX_CLAIM_BATCH_SIZE:50}
    outbox-max-attempts: ${ESTOMA_OUTBOX_MAX_ATTEMPTS:10}
    outbox-poll-interval: ${ESTOMA_OUTBOX_POLL_INTERVAL:1000}
    outbox-relay-enabled: ${ESTOMA_OUTBOX_RELAY_ENABLED:true}
    recovery-worker-enabled: ${ESTOMA_RECOVERY_WORKER_ENABLED:true}
    recovery-poll-interval: ${ESTOMA_RECOVERY_POLL_INTERVAL:1000}
    recovery-result-timeout: ${ESTOMA_RECOVERY_RESULT_TIMEOUT:30s}
