spring:
  application:
    name: wash-execution-service
  datasource:
    hikari:
      maximum-pool-size: ${WASH_EXECUTION_DB_POOL_SIZE:4}
      minimum-idle: ${WASH_EXECUTION_DB_MIN_IDLE:1}
      connection-timeout: 10000
      validation-timeout: 5000
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        observation-enabled: true
    template:
      observation-enabled: true
server:
  port: 8080
management:
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://otel-collector.monitoring.svc.cluster.local:4318/v1/traces
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db,rabbit,projectionReadiness
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  info:
    env:
      enabled: true
info:
  app:
    name: wash-execution-service
    version: 0.1.0
estoma:
  messaging:
    publisher-confirm-timeout: 5s
    outbox-lease: 30s
    outbox-claim-batch-size: 50
    outbox-poll-interval: 1000
    outbox-relay-enabled: true
    inbox-lease: 30s
    deferred-replay-poll-interval: 1000
    deferred-replay-enabled: true
    recovery-poll-interval: 1000
    recovery-worker-enabled: true
    recovery-result-timeout: 30s
    recovery-zone: America/Mexico_City
