spring:
  application:
    name: appointments-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:appointments}}
    username: ${DB_USERNAME:appointments}
    password: ${DB_PASSWORD:appointments}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:4}
      minimum-idle: ${DB_MIN_IDLE:1}
      connection-timeout: 10000
      validation-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        auto-startup: ${ESTOMA_MESSAGING_LISTENERS_ENABLED:false}
        observation-enabled: true
    template:
      observation-enabled: true
server:
  port: 8080
estoma:
  messaging:
    topology-declare: ${ESTOMA_MESSAGING_TOPOLOGY_DECLARE:false}
    listeners-enabled: ${ESTOMA_MESSAGING_LISTENERS_ENABLED:false}
    publisher-confirm-timeout: ${ESTOMA_MESSAGING_CONFIRM_TIMEOUT:5s}
    outbox-claim-batch-size: ${ESTOMA_MESSAGING_OUTBOX_BATCH:10}
    outbox-lease: ${ESTOMA_MESSAGING_OUTBOX_LEASE:2m}
    outbox-poll-interval: ${ESTOMA_MESSAGING_OUTBOX_POLL:1s}
    outbox-relay-enabled: ${ESTOMA_MESSAGING_OUTBOX_RELAY_ENABLED:false}
    recovery-worker-enabled: ${ESTOMA_MESSAGING_RECOVERY_WORKER_ENABLED:false}
    retry1-ttl: ${ESTOMA_MESSAGING_RETRY1_TTL:5s}
    retry2-ttl: ${ESTOMA_MESSAGING_RETRY2_TTL:30s}
  qr:
    secret: ${ESTOMA_QR_SECRET:}
management:
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://otel-collector.monitoring.svc.cluster.local:4318/v1/traces
  endpoint:
    health:
      access: read-only
      probes:
        enabled: true
      show-details: never
    prometheus:
      access: read-only
    info:
      access: read-only
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health,info,prometheus
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
    group:
      readiness:
        include: readinessState,db,flyway,schemaVersion,rabbitMessaging,projectionReadiness
      liveness:
        include: livenessState
  info:
    env:
      enabled: true
info:
  app:
    name: appointments-service
    version: 0.1.0
