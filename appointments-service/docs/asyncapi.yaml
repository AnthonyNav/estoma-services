asyncapi: 3.0.0

info:
  title: appointments-service BFF Query V1 messaging contract
  version: 1.0.0
  description: >
    Executable wire contract for the durable, owner-derived availability and QR recovery
    snapshots consumed by platform-bff. Normative business rules remain in
    estomatologia-platform-docs/main.

defaultContentType: application/json

channels:
  queries.appointments:
    address: queries.appointments
    description: Durable queue bound to platform.queries with routing key appointments.
    messages:
      getAppointmentAvailability:
        $ref: '#/components/messages/GetAppointmentAvailability'
      listAppointmentQrProjectionSnapshotsPage:
        $ref: '#/components/messages/ListAppointmentQrProjectionSnapshotsPage'
    bindings:
      amqp:
        is: queue
        queue:
          name: queries.appointments
          durable: true
          exclusive: false
          autoDelete: false
          arguments:
            x-dead-letter-exchange: platform.dlx
            x-dead-letter-routing-key: queries.appointments.dlq

  platform.results.bff:
    address: platform.results
    description: Direct exchange publication with routing key bff.
    messages:
      getAppointmentAvailabilityResult:
        $ref: '#/components/messages/GetAppointmentAvailabilityResult'
      listAppointmentQrProjectionSnapshotsPageResult:
        $ref: '#/components/messages/ListAppointmentQrProjectionSnapshotsPageResult'

operations:
  receiveAppointmentAvailabilityQuery:
    action: receive
    channel:
      $ref: '#/channels/queries.appointments'
  sendAppointmentAvailabilityResult:
    action: send
    channel:
      $ref: '#/channels/platform.results.bff'
  receiveAppointmentQrProjectionSnapshotsPageQuery:
    action: receive
    channel:
      $ref: '#/channels/queries.appointments'
  sendAppointmentQrProjectionSnapshotsPageResult:
    action: send
    channel:
      $ref: '#/channels/platform.results.bff'

components:
  messages:
    GetAppointmentAvailability:
      name: GetAppointmentAvailability
      payload:
        $ref: '#/components/schemas/GetAppointmentAvailabilityEnvelope'
    GetAppointmentAvailabilityResult:
      name: GetAppointmentAvailabilityResult
      payload:
        $ref: '#/components/schemas/GetAppointmentAvailabilityResultEnvelope'
    ListAppointmentQrProjectionSnapshotsPage:
      name: ListAppointmentQrProjectionSnapshotsPage
      payload:
        $ref: '#/components/schemas/ListAppointmentQrProjectionSnapshotsPageEnvelope'
    ListAppointmentQrProjectionSnapshotsPageResult:
      name: ListAppointmentQrProjectionSnapshotsPageResult
      payload:
        $ref: '#/components/schemas/ListAppointmentQrProjectionSnapshotsPageResultEnvelope'

  schemas:
    Uuid:
      type: string
      format: uuid
    Instant:
      type: string
      format: date-time
    SystemActor:
      type: object
      additionalProperties: false
      required: [type, service]
      properties:
        type:
          const: SYSTEM
        service:
          type: string

    GetAppointmentAvailabilityEnvelope:
      type: object
      additionalProperties: false
      required:
        - messageId
        - messageType
        - messageVersion
        - messageKind
        - producer
        - occurredAt
        - correlationId
        - actor
        - payload
      properties:
        messageId:
          $ref: '#/components/schemas/Uuid'
        messageType:
          const: GetAppointmentAvailability
        messageVersion:
          const: 1
        messageKind:
          const: QUERY
        producer:
          const: bff
        occurredAt:
          $ref: '#/components/schemas/Instant'
        correlationId:
          $ref: '#/components/schemas/Uuid'
        causationId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        operationId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        idempotencyKey:
          type: 'null'
        aggregateId:
          type: 'null'
        aggregateVersion:
          type: 'null'
        actor:
          allOf:
            - $ref: '#/components/schemas/SystemActor'
            - type: object
              properties:
                service:
                  const: bff
        payload:
          $ref: '#/components/schemas/AvailabilityRequestContext'

    AvailabilityRequestContext:
      type: object
      additionalProperties: false
      required:
        - studentAccountId
        - serviceDate
        - appointmentType
        - instrumentCount
        - pieceType
        - courseSectionId
      properties:
        studentAccountId:
          $ref: '#/components/schemas/Uuid'
        serviceDate:
          type: string
          format: date
        appointmentType:
          enum: [NORMAL, JOURNEY, IMMUNOCOMPROMISED]
        instrumentCount:
          type: integer
          minimum: 1
          maximum: 80
        pieceType:
          enum: [HIGH_SPEED, LOW_SPEED, CONTRA_ANGLE]
        courseSectionId:
          $ref: '#/components/schemas/Uuid'

    GetAppointmentAvailabilityResultEnvelope:
      type: object
      additionalProperties: false
      required:
        - messageId
        - messageType
        - messageVersion
        - messageKind
        - producer
        - occurredAt
        - correlationId
        - causationId
        - actor
        - payload
      properties:
        messageId:
          $ref: '#/components/schemas/Uuid'
        messageType:
          const: GetAppointmentAvailabilityResult
        messageVersion:
          const: 1
        messageKind:
          const: RESULT
        producer:
          const: appointments
        occurredAt:
          $ref: '#/components/schemas/Instant'
        correlationId:
          $ref: '#/components/schemas/Uuid'
        causationId:
          $ref: '#/components/schemas/Uuid'
        operationId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        idempotencyKey:
          type: 'null'
        aggregateId:
          type: 'null'
        aggregateVersion:
          type: 'null'
        actor:
          allOf:
            - $ref: '#/components/schemas/SystemActor'
            - type: object
              properties:
                service:
                  const: appointments
        payload:
          oneOf:
            - $ref: '#/components/schemas/AvailabilitySucceededPayload'
            - $ref: '#/components/schemas/AvailabilityRejectedPayload'

    AvailabilitySucceededPayload:
      type: object
      additionalProperties: false
      required: [status, data]
      properties:
        status:
          const: SUCCEEDED
        data:
          $ref: '#/components/schemas/AvailabilitySnapshot'

    AvailabilityRejectedPayload:
      type: object
      additionalProperties: false
      required: [status, error]
      properties:
        status:
          const: REJECTED
        error:
          type: object
          additionalProperties: false
          required: [code]
          properties:
            code:
              const: INVALID_AVAILABILITY_CONTEXT

    AvailabilitySnapshot:
      type: object
      additionalProperties: false
      required:
        - snapshotId
        - snapshotGeneratedAt
        - freshUntil
        - requestContext
        - canSchedule
        - blockingReasons
        - dailyPenaltyPoints
        - dailyCompletedAppointments
        - exceptionalAuthorizationRequired
        - exceptionalAuthorizationAvailable
        - exceptionalAuthorizationId
        - availableTimeSlots
      properties:
        snapshotId:
          $ref: '#/components/schemas/Uuid'
        snapshotGeneratedAt:
          $ref: '#/components/schemas/Instant'
        freshUntil:
          $ref: '#/components/schemas/Instant'
        requestContext:
          $ref: '#/components/schemas/AvailabilityRequestContext'
        canSchedule:
          type: boolean
        blockingReasons:
          type: array
          uniqueItems: true
          items:
            enum:
              - ACTIVE_APPOINTMENT_EXISTS
              - STUDENT_BLOCKED
              - DAILY_COMPLETED_LIMIT
              - EXCEPTIONAL_AUTHORIZATION_REQUIRED
              - ACADEMIC_ENROLLMENT_INVALID
              - STUDENT_ACCESS_DENIED
        dailyPenaltyPoints:
          type: integer
          minimum: 0
        dailyCompletedAppointments:
          type: integer
          minimum: 0
        exceptionalAuthorizationRequired:
          type: boolean
        exceptionalAuthorizationAvailable:
          type: boolean
        exceptionalAuthorizationId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        availableTimeSlots:
          type: array
          items:
            $ref: '#/components/schemas/AvailableTimeSlot'

    AvailableTimeSlot:
      type: object
      additionalProperties: false
      required:
        - appointmentTimeSlotId
        - startsAt
        - endsAt
        - availableCapacity
        - bookingDeadlineAt
      properties:
        appointmentTimeSlotId:
          $ref: '#/components/schemas/Uuid'
        startsAt:
          $ref: '#/components/schemas/Instant'
        endsAt:
          $ref: '#/components/schemas/Instant'
        availableCapacity:
          type: integer
          minimum: 1
        bookingDeadlineAt:
          $ref: '#/components/schemas/Instant'

    ListAppointmentQrProjectionSnapshotsPageEnvelope:
      type: object
      additionalProperties: false
      required: [messageId, messageType, messageVersion, messageKind, producer, occurredAt, correlationId, actor, payload]
      properties:
        messageId: {$ref: '#/components/schemas/Uuid'}
        messageType: {const: ListAppointmentQrProjectionSnapshotsPage}
        messageVersion: {const: 1}
        messageKind: {const: QUERY}
        producer: {const: bff}
        occurredAt: {$ref: '#/components/schemas/Instant'}
        correlationId: {$ref: '#/components/schemas/Uuid'}
        causationId:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        operationId:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        idempotencyKey: {type: 'null'}
        aggregateId: {type: 'null'}
        aggregateVersion: {type: 'null'}
        actor:
          allOf:
            - $ref: '#/components/schemas/SystemActor'
            - type: object
              properties:
                service: {const: bff}
        payload: {$ref: '#/components/schemas/AppointmentQrProjectionPageRequest'}

    AppointmentQrProjectionPageRequest:
      type: object
      additionalProperties: false
      required: [serviceDate, pageSize]
      properties:
        serviceDate: {type: string, format: date}
        pageSize: {type: integer, minimum: 1, maximum: 100}
        pageToken: {type: string, minLength: 1, maxLength: 160}

    ListAppointmentQrProjectionSnapshotsPageResultEnvelope:
      type: object
      additionalProperties: false
      required: [messageId, messageType, messageVersion, messageKind, producer, occurredAt, correlationId, causationId, actor, payload]
      properties:
        messageId: {$ref: '#/components/schemas/Uuid'}
        messageType: {const: ListAppointmentQrProjectionSnapshotsPageResult}
        messageVersion: {const: 1}
        messageKind: {const: RESULT}
        producer: {const: appointments}
        occurredAt: {$ref: '#/components/schemas/Instant'}
        correlationId: {$ref: '#/components/schemas/Uuid'}
        causationId: {$ref: '#/components/schemas/Uuid'}
        operationId:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        idempotencyKey: {type: 'null'}
        aggregateId: {type: 'null'}
        aggregateVersion: {type: 'null'}
        actor:
          allOf:
            - $ref: '#/components/schemas/SystemActor'
            - type: object
              properties:
                service: {const: appointments}
        payload:
          oneOf:
            - $ref: '#/components/schemas/AppointmentQrProjectionPageSucceededPayload'
            - $ref: '#/components/schemas/AppointmentQrProjectionPageRejectedPayload'

    AppointmentQrProjectionPageSucceededPayload:
      type: object
      additionalProperties: false
      required: [status, data]
      properties:
        status: {const: SUCCEEDED}
        data:
          type: object
          additionalProperties: false
          required: [snapshotGeneratedAt, serviceDate, items]
          properties:
            snapshotGeneratedAt: {$ref: '#/components/schemas/Instant'}
            serviceDate: {type: string, format: date}
            items:
              type: array
              items: {$ref: '#/components/schemas/AppointmentQrProjectionSnapshot'}
            nextPageToken: {type: string, minLength: 1, maxLength: 160}

    AppointmentQrProjectionSnapshot:
      type: object
      additionalProperties: false
      required: [appointmentId, appointmentVersion, appointmentStatus, entryAuthorizedAt, qrRepresentation]
      properties:
        appointmentId: {$ref: '#/components/schemas/Uuid'}
        appointmentVersion: {type: integer, minimum: 1}
        appointmentStatus:
          enum: [SCHEDULED, IN_PROGRESS, CANCELLED, MISSED, ENTRY_REJECTED, COMPLETED]
        entryAuthorizedAt:
          oneOf: [{$ref: '#/components/schemas/Instant'}, {type: 'null'}]
        qrRepresentation:
          description: Present for active rows; null is an explicit terminal tombstone.
          oneOf: [{type: string, minLength: 1, maxLength: 2000}, {type: 'null'}]

    AppointmentQrProjectionPageRejectedPayload:
      type: object
      additionalProperties: false
      required: [status, error]
      properties:
        status: {const: REJECTED}
        error:
          type: object
          additionalProperties: false
          required: [code]
          properties:
            code:
              enum: [QR_PROJECTION_DISABLED, INVALID_SERVICE_DATE, INVALID_PAGE_SIZE, INVALID_PAGE_TOKEN]
