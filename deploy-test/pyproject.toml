[project]
name = "deploy-test"
version = "0.1.0"
description = "Minimal FastAPI service for Estoma deployment automation validation"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.124.2",
  "uvicorn[standard]==0.38.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
