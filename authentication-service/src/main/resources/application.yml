spring:
  application:
    name: authentication-service

  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/authentication_db}
    username: ${AUTH_DB_RUNTIME_USER:authentication_service}
    password: ${AUTH_DB_RUNTIME_PASSWORD:authentication_service}
    hikari:
      # Bounds how long a query can hang against a wedged connection (a
      # network partition, a frozen peer) rather than relying on the OS's
      # TCP keepalive, which can take minutes to notice. Set at the pool
      # level (not baked into the JDBC URL) so it applies regardless of
      # what AUTH_DB_URL is provided.
      connection-timeout: 10000
      validation-timeout: 5000
      data-source-properties:
        socketTimeout: 10
        connectTimeout: 10

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
    # Separate migration credentials, per
    # security-observability.md:235. Defaults to the runtime credentials so
    # a single-user local/dev database still works; estoma-infra supplies
    # distinct migration credentials in staging/prod.
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/authentication_db}
    user: ${AUTH_DB_MIGRATION_USER:authentication_service}
    password: ${AUTH_DB_MIGRATION_PASSWORD:authentication_service}
    placeholders:
      runtime_role: ${AUTH_DB_RUNTIME_USER:authentication_service}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    # Required for RabbitConfig's RabbitTemplate confirm/return callbacks
    # to actually fire (system_contract.md "Outbox Operational Policy").
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # Broker-side TTL retry tiers handle backoff, not Spring AMQP's
        # in-process retry -- it would block the consumer thread for the
        # whole backoff and lose the attempt count on pod restart.
        retry:
          enabled: false
        default-requeue-rejected: false

estoma:
  # The deployment environment name, read by EstomaJsonLogFormatter for the
  # mandatory "environment" log field (system_contract.md "Observability
  # Parameters").
  environment: ${ESTOMA_ENVIRONMENT:local}
  messaging:
    topology-declare: ${ESTOMA_MESSAGING_TOPOLOGY_DECLARE:true}
    publisher-confirm-timeout: 5s
    outbox-claim-batch-size: 50
    outbox-max-attempts: 10
    outbox-poll-interval: 1000
    outbox-relay-enabled: ${ESTOMA_OUTBOX_RELAY_ENABLED:true}

server:
  port: 8080

logging:
  structured:
    format:
      # Custom formatter, not one of Boot's built-in formats: none of
      # ECS/GELF/Logstash match the field set fixed in
      # system_contract.md "Observability Parameters" -- see
      # EstomaJsonLogFormatter.
      console: com.estoma.authentication.infrastructure.observability.EstomaJsonLogFormatter

management:
  endpoints:
    # Deny-by-default, then opt in explicitly below (system_contract.md
    # "Operational HTTP Interface").
    access:
      default: none
    web:
      base-path: /
      exposure:
        include: health,info,prometheus
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      access: read-only
      probes:
        enabled: true
      show-details: never
      show-components: never
      group:
        startup:
          include: db, schemaVersion
        readiness:
          include: db, commandConsumer, outboxRelay
        liveness:
          # Deliberately excludes db: liveness must never run an expensive
          # check, and a temporarily degraded dependency must not trigger a
          # restart loop (security-observability.md:683-707).
          include: livenessState
    info:
      access: read-only
    prometheus:
      access: read-only
  info:
    env:
      enabled: true

info:
  app:
    name: authentication-service
    version: 0.1.0
