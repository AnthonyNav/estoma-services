asyncapi: 3.0.0

info:
  title: registros-service V1 messaging contract
  version: 1.0.0
  description: >
    Executable V1 contract for pre-registro to a Jornada: durable Commands
    accepted from the BFF, correlated Results, domain Events published on
    platform.events, and jornadas-service's domain Events consumed to keep
    the local Jornada projection (cupo, semestres permitidos) current.
    Normative prose remains in estomatologia-platform-docs/main
    (03-services/domains/practicas-profesionales/registros/).

defaultContentType: application/json

channels:
  commands.registros:
    address: commands.registros
    description: Durable command queue bound to platform.commands with routing key registros.
    messages:
      crearRegistro:
        $ref: '#/components/messages/CrearRegistro'
      confirmarRegistro:
        $ref: '#/components/messages/ConfirmarRegistro'
      rechazarRegistro:
        $ref: '#/components/messages/RechazarRegistro'
      cancelarRegistroPorAlumno:
        $ref: '#/components/messages/CancelarRegistroPorAlumno'
    bindings:
      amqp:
        is: queue
        queue:
          name: commands.registros
          durable: true
          exclusive: false
          autoDelete: false
          arguments:
            x-dead-letter-exchange: platform.dlx
            x-dead-letter-routing-key: dlq.commands.registros

  events.registros:
    address: events.registros
    description: >
      Durable consumer queue bound to platform.events with routing key
      jornadas.# — feeds the local, read-only Jornada projection (cupo,
      semestres permitidos, estado) used to validate CrearRegistro without a
      synchronous call into jornadas-service.
    messages:
      jornadaPublicada:
        $ref: '#/components/messages/JornadaPublicadaConsumed'
      jornadaEditada:
        $ref: '#/components/messages/JornadaEditadaConsumed'
      jornadaCancelada:
        $ref: '#/components/messages/JornadaCanceladaConsumed'
      jornadaFinalizada:
        $ref: '#/components/messages/JornadaFinalizadaConsumed'
    bindings:
      amqp:
        is: queue
        queue:
          name: events.registros
          durable: true
          exclusive: false
          autoDelete: false
          arguments:
            x-dead-letter-exchange: platform.dlx
            x-dead-letter-routing-key: dlq.events.registros

  platform.results:
    address: platform.results
    description: Direct exchange used by registros to return correlated Results to the requester (results.bff).
    messages:
      crearRegistroResult:
        $ref: '#/components/messages/CrearRegistroResult'
      confirmarRegistroResult:
        $ref: '#/components/messages/ConfirmarRegistroResult'
      rechazarRegistroResult:
        $ref: '#/components/messages/RechazarRegistroResult'
      cancelarRegistroPorAlumnoResult:
        $ref: '#/components/messages/CancelarRegistroPorAlumnoResult'

  platform.events:
    address: platform.events
    description: Topic exchange used by registros to publish confirmed facts about the Registro lifecycle.
    messages:
      registroCreado:
        $ref: '#/components/messages/RegistroCreado'
      registroConfirmado:
        $ref: '#/components/messages/RegistroConfirmado'
      registroRechazado:
        $ref: '#/components/messages/RegistroRechazado'
      registroCanceladoPorAlumno:
        $ref: '#/components/messages/RegistroCanceladoPorAlumno'
      registroCanceladoPorJornadaCancelada:
        $ref: '#/components/messages/RegistroCanceladoPorJornadaCancelada'
      registroCompletado:
        $ref: '#/components/messages/RegistroCompletado'

operations:
  receiveRegistrosCommands:
    action: receive
    channel:
      $ref: '#/channels/commands.registros'
  receiveJornadasEvents:
    action: receive
    channel:
      $ref: '#/channels/events.registros'
  sendCommandResults:
    action: send
    channel:
      $ref: '#/channels/platform.results'
  sendRegistroEvents:
    action: send
    channel:
      $ref: '#/channels/platform.events'

components:
  messages:
    CrearRegistro:
      name: CrearRegistro
      payload:
        allOf:
          - $ref: '#/components/schemas/CommandEnvelope'
          - type: object
            properties:
              payload:
                $ref: '#/components/schemas/CrearRegistroPayload'

    ConfirmarRegistro:
      name: ConfirmarRegistro
      payload:
        allOf:
          - $ref: '#/components/schemas/CommandEnvelope'
          - type: object
            required: [aggregateId]
            properties:
              payload:
                type: object

    RechazarRegistro:
      name: RechazarRegistro
      payload:
        allOf:
          - $ref: '#/components/schemas/CommandEnvelope'
          - type: object
            required: [aggregateId]
            properties:
              payload:
                $ref: '#/components/schemas/RechazarRegistroPayload'

    CancelarRegistroPorAlumno:
      name: CancelarRegistroPorAlumno
      payload:
        allOf:
          - $ref: '#/components/schemas/CommandEnvelope'
          - type: object
            required: [aggregateId]
            properties:
              payload:
                $ref: '#/components/schemas/CancelarRegistroPorAlumnoPayload'

    CrearRegistroResult:
      name: CrearRegistroResult
      payload:
        allOf:
          - $ref: '#/components/schemas/ResultEnvelope'
          - type: object
            properties:
              payload:
                $ref: '#/components/schemas/RegistroResultPayload'

    ConfirmarRegistroResult:
      name: ConfirmarRegistroResult
      payload:
        allOf:
          - $ref: '#/components/schemas/ResultEnvelope'
          - type: object
            properties:
              payload:
                $ref: '#/components/schemas/RegistroResultPayload'

    RechazarRegistroResult:
      name: RechazarRegistroResult
      payload:
        allOf:
          - $ref: '#/components/schemas/ResultEnvelope'
          - type: object
            properties:
              payload:
                $ref: '#/components/schemas/RegistroResultPayload'

    CancelarRegistroPorAlumnoResult:
      name: CancelarRegistroPorAlumnoResult
      payload:
        allOf:
          - $ref: '#/components/schemas/ResultEnvelope'
          - type: object
            properties:
              payload:
                $ref: '#/components/schemas/RegistroResultPayload'

    RegistroCreado:
      name: RegistroCreado
      payload:
        allOf:
          - $ref: '#/components/schemas/RegistroEventEnvelope'
          - type: object
            properties:
              payload:
                $ref: '#/components/schemas/RegistroCreadoPayload'

    RegistroConfirmado:
      name: RegistroConfirmado
      payload:
        allOf:
          - $ref: '#/components/schemas/RegistroEventEnvelope'
          - type: object
            properties:
              payload:
                $ref: '#/components/schemas/RegistroCreadoPayload'

    RegistroRechazado:
      name: RegistroRechazado
      payload:
        allOf:
          - $ref: '#/components/schemas/RegistroEventEnvelope'
          - type: object
            properties:
              payload:
                $ref: '#/components/schemas/RegistroRechazadoPayload'

    RegistroCanceladoPorAlumno:
      name: RegistroCanceladoPorAlumno
      payload:
        allOf:
          - $ref: '#/components/schemas/RegistroEventEnvelope'
          - type: object
            properties:
              payload:
                $ref: '#/components/schemas/RegistroIdPayload'

    RegistroCanceladoPorJornadaCancelada:
      name: RegistroCanceladoPorJornadaCancelada
      payload:
        allOf:
          - $ref: '#/components/schemas/RegistroEventEnvelope'
          - type: object
            properties:
              payload:
                $ref: '#/components/schemas/RegistroCanceladoPorJornadaPayload'

    RegistroCompletado:
      name: RegistroCompletado
      description: >
        Un Registro Confirmado transicionó automáticamente a Completado
        porque su Jornada finalizó (JornadaFinalizada). RegistroIdPayload
        reutiliza el mismo shape que RegistroCanceladoPorAlumno.
      payload:
        allOf:
          - $ref: '#/components/schemas/RegistroEventEnvelope'
          - type: object
            properties:
              payload:
                $ref: '#/components/schemas/RegistroCanceladoPorJornadaPayload'

    JornadaPublicadaConsumed:
      name: JornadaPublicada
      description: Consumed from jornadas-service. Authoritative shape lives in jornadas-service/docs/asyncapi.yaml.
      payload:
        type: object

    JornadaEditadaConsumed:
      name: JornadaEditada
      payload:
        type: object

    JornadaCanceladaConsumed:
      name: JornadaCancelada
      payload:
        type: object

    JornadaFinalizadaConsumed:
      name: JornadaFinalizada
      description: Consumed from jornadas-service. Authoritative shape lives in jornadas-service/docs/asyncapi.yaml.
      payload:
        type: object

  schemas:
    BaseEnvelope:
      type: object
      required:
        [messageId, messageType, messageVersion, messageKind, producer,
         occurredAt, correlationId, actor, payload]
      properties:
        messageId: {type: string, format: uuid}
        messageType: {type: string}
        messageVersion: {type: integer, const: 1}
        messageKind: {type: string}
        producer: {type: string}
        occurredAt: {type: string, format: date-time}
        correlationId: {type: string, format: uuid}
        causationId: {type: ['string', 'null'], format: uuid}
        operationId: {type: ['string', 'null'], format: uuid}
        idempotencyKey: {type: ['string', 'null']}
        aggregateId: {type: ['string', 'null'], format: uuid}
        aggregateVersion: {type: ['integer', 'null']}
        actor: {type: object}
        payload: {type: object}

    CommandEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseEnvelope'
        - type: object
          required: [operationId, idempotencyKey]
          properties:
            messageKind: {type: string, const: COMMAND}
            producer: {type: string, const: bff}

    ResultEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseEnvelope'
        - type: object
          required: [causationId, operationId]
          properties:
            messageKind: {type: string, const: RESULT}
            producer: {type: string, const: registros}

    RegistroEventEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseEnvelope'
        - type: object
          required: [aggregateId, aggregateVersion]
          properties:
            messageKind: {type: string, const: EVENT}
            producer: {type: string, const: registros}

    Error:
      type: object
      required: [code]
      properties:
        code: {type: string}
        details: {type: object}

    RejectedOrFailedPayload:
      type: object
      required: [status, error]
      properties:
        status: {type: string, enum: [REJECTED, FAILED, EXPIRED]}
        error: {$ref: '#/components/schemas/Error'}

    CrearRegistroPayload:
      type: object
      required: [jornadaId, alumnoId, semestreAlumno]
      description: >
        alumnoId y semestreAlumno viajan explícitos en el payload en V1 —
        cumplimiento-documental y la proyección de semestre de academic-service
        todavía no existen; el BFF resuelve ambos del contexto de sesión.
      properties:
        jornadaId: {type: string, format: uuid}
        alumnoId: {type: string, format: uuid}
        semestreAlumno: {type: integer, minimum: 1, maximum: 14}

    RechazarRegistroPayload:
      type: object
      required: [motivo]
      properties:
        motivo: {type: string, minLength: 1, maxLength: 500}

    CancelarRegistroPorAlumnoPayload:
      type: object
      required: [alumnoId]
      properties:
        alumnoId: {type: string, format: uuid}

    RegistroResultPayload:
      oneOf:
        - type: object
          required: [status, data]
          properties:
            status: {type: string, const: SUCCEEDED}
            data:
              type: object
              required: [registroId, jornadaId, version, estado]
              properties:
                registroId: {type: string, format: uuid}
                jornadaId: {type: string, format: uuid}
                version: {type: integer}
                estado:
                  type: string
                  enum: [PENDIENTE_VALIDACION, CONFIRMADO, RECHAZADO, CANCELADO_ALUMNO, CANCELADO_JORNADA_CANCELADA]
        - $ref: '#/components/schemas/RejectedOrFailedPayload'

    RegistroIdPayload:
      type: object
      required: [registroId]
      properties:
        registroId: {type: string, format: uuid}

    RegistroCreadoPayload:
      type: object
      required: [registroId, jornadaId, alumnoId]
      properties:
        registroId: {type: string, format: uuid}
        jornadaId: {type: string, format: uuid}
        alumnoId: {type: string, format: uuid}

    RegistroRechazadoPayload:
      type: object
      required: [registroId, motivo]
      properties:
        registroId: {type: string, format: uuid}
        motivo: {type: string}

    RegistroCanceladoPorJornadaPayload:
      type: object
      required: [registroId, jornadaId]
      properties:
        registroId: {type: string, format: uuid}
        jornadaId: {type: string, format: uuid}
