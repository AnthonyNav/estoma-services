spring:
  application:
    name: registros-service
  datasource:
    url: ${REGISTROS_DB_URL:jdbc:postgresql://localhost:5432/registros_db}
    username: ${REGISTROS_DB_USER:registros_service}
    password: ${REGISTROS_DB_PASSWORD:registros_service}
  flyway:
    url: ${REGISTROS_DB_URL:jdbc:postgresql://localhost:5432/registros_db}
    user: ${REGISTROS_DB_USER:registros_service}
    password: ${REGISTROS_DB_PASSWORD:registros_service}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        default-requeue-rejected: false

server:
  port: 8080

management:
  endpoints:
    access:
      default: none
    web:
      base-path: /
      exposure:
        include: health,info,prometheus
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      access: read-only
      probes:
        enabled: true
      show-details: never
      group:
        startup:
          include: db
        readiness:
          include: db
        liveness:
          include: livenessState
    info:
      access: read-only
    prometheus:
      access: read-only
  info:
    env:
      enabled: true

info:
  app:
    name: registros-service
    version: 0.1.0
