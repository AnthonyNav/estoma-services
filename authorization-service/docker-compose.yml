# Local development only. Deployment manifests live in estoma-infra.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authorization_db
      POSTGRES_USER: authorization_service
      POSTGRES_PASSWORD: authorization_service
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authorization_service -d authorization_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
