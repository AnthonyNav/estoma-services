spring:
  application:
    name: authorization-service

  datasource:
    url: ${AUTHORIZATION_DB_URL:jdbc:postgresql://localhost:5432/authorization_db}
    username: ${AUTHORIZATION_DB_RUNTIME_USER:authorization_service}
    password: ${AUTHORIZATION_DB_RUNTIME_PASSWORD:authorization_service}
    hikari:
      connection-timeout: 10000
      validation-timeout: 5000
      data-source-properties:
        socketTimeout: 10
        connectTimeout: 10

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
    url: ${AUTHORIZATION_DB_URL:jdbc:postgresql://localhost:5432/authorization_db}
    user: ${AUTHORIZATION_DB_MIGRATION_USER:authorization_service}
    password: ${AUTHORIZATION_DB_MIGRATION_PASSWORD:authorization_service}
    placeholders:
      runtime_role: ${AUTHORIZATION_DB_RUNTIME_USER:authorization_service}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: false

server:
  port: 8080

logging:
  structured:
    format:
      console: ecs

estoma:
  messaging:
    topology-declare: ${ESTOMA_MESSAGING_TOPOLOGY_DECLARE:true}
    listeners-enabled: ${ESTOMA_MESSAGING_LISTENERS_ENABLED:true}
    publisher-confirm-timeout: ${ESTOMA_PUBLISHER_CONFIRM_TIMEOUT:5s}
    outbox-claim-batch-size: ${ESTOMA_OUTBOX_CLAIM_BATCH_SIZE:50}
    outbox-lease: ${ESTOMA_OUTBOX_LEASE:2m}
    outbox-poll-interval: ${ESTOMA_OUTBOX_POLL_INTERVAL:1s}
    outbox-relay-enabled: ${ESTOMA_OUTBOX_RELAY_ENABLED:true}
    recovery-poll-interval: ${ESTOMA_RECOVERY_POLL_INTERVAL:1s}
    recovery-worker-enabled: ${ESTOMA_RECOVERY_WORKER_ENABLED:true}
    recovery-result-timeout: ${ESTOMA_RECOVERY_RESULT_TIMEOUT:30s}
    retry-1-ttl: ${ESTOMA_MESSAGING_RETRY_1_TTL:5s}
    retry-2-ttl: ${ESTOMA_MESSAGING_RETRY_2_TTL:30s}

management:
  endpoints:
    access:
      default: none
    web:
      base-path: /actuator
      exposure:
        include: health,prometheus
  endpoint:
    health:
      access: read-only
      probes:
        enabled: true
      show-details: never
      show-components: never
      group:
        readiness:
          include: db,schemaVersion,rabbit,outboxRelay,projectionRecovery,commandConsumer,externalEventConsumer,queryConsumer,recoveryResultConsumer
        liveness:
          include: livenessState
    prometheus:
      access: read-only
  info:
    env:
      enabled: true
  health:
    db:
      query: SELECT 1 FROM systems LIMIT 1
info:
  app:
    name: authorization-service
    version: 0.1.0
